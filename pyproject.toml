[project]
name = "llm-robotics-playground"
version = "0.1.0"
description = "A library of experiments using frontier LLMs/VLMs for robotics tasks, currently focusing on GPT-6 Astra."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mujoco==3.12.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "Pillow==12.3.0",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
]

[tool.uv]
package = false
